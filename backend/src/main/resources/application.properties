# In production, set this to include a project URL or maintainer email as requested by Wikimedia.
wikipedia.user-agent=${WIKIPEDIA_USER_AGENT:WikiConnectionFinder/0.0.1 (https://github.com/Deeksha2120/wiki-connection-finder)}
wikipedia.connect-timeout=3s
wikipedia.read-timeout=10s
wikipedia.max-outgoing-links=${WIKIPEDIA_MAX_OUTGOING_LINKS:5000}
logging.level.com.example.wikiconnectionfinder.client=DEBUG
logging.level.com.example.wikiconnectionfinder.service.ConnectionService=DEBUG
connection-search.max-depth=${CONNECTION_SEARCH_MAX_DEPTH:6}
connection-search.max-expanded-articles=${CONNECTION_SEARCH_MAX_EXPANDED_ARTICLES:100}
connection-search.max-duration=${CONNECTION_SEARCH_MAX_DURATION:30s}
